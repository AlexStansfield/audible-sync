<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The service rewrites this to the path it is served under; keep it exactly so -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Audible Sync</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // The theme before the first paint, so a light-theme browser never flashes dark.
      // Mirrors src/theme.ts: "light" | "dark" stored, anything else follows the system
      (() => {
        let choice = null;
        try {
          choice = localStorage.getItem("audible-sync.theme");
        } catch {}
        const dark =
          choice === "dark" || (choice !== "light" && !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
