[general]
debug = true

[sync]
; max-download = 10
; audible-auth-file = audible.json

[folders]
downloads = data/downloads
audiobooks = audiobooks

[naming]
; Where each converted book is filed, relative to the audiobooks folder, and what
; the files are called (extension is added automatically). Text inside [...] is
; only used when every placeholder inside it has a value, so books without a
; series are filed as {author}/{title}. See the README for all placeholders.
folder = {author}/[{series}/][{sequence} - ]{title}
filename = {title}

[encoding]
; format: m4b keeps the original AAC audio from Audible (no re-encode, no quality
; loss); oga re-encodes to Opus in an Ogg container, which is much smaller for
; speech. oga needs an FFmpeg build with libopus (ffmpeg -encoders | grep libopus).
; bitrate: Opus bitrate in kbps, only used for oga. 64 matches Audible's own
; quality; 32 to 48 is still very good for speech.
format = m4b
bitrate = 64
