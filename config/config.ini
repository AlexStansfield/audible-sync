[general]
; Sets the log level to DEBUG, which includes the full FFmpeg command and the
; generated metadata for every book. INFO when false.
debug = false

[sync]
; max-download = 10
; audible-auth-file = audible.json

[folders]
downloads = data/downloads
audiobooks = audiobooks

[naming]
; Where each converted book is filed, relative to the audiobooks folder, and what
; the files are called (extension is added automatically). Text inside [...] is
; only used when every placeholder inside it has a value, so books without a
; series are filed as {author}/{title}. See the README for all placeholders.
folder = {author}/[{series}/][{sequence} - ]{title}
filename = {title}

[encoding]
; Optional. By default the audio is kept exactly as Audible supplies it (AAC in an
; M4B container, no re-encoding). Set format = oga to re-encode to Opus in an Ogg
; container, which is much smaller for speech; bitrate is the Opus bitrate in kbps
; and is only used with oga. oga needs an FFmpeg build with libopus
; (ffmpeg -encoders | grep libopus); the Docker image has it.
; format = oga
; bitrate = 64
