info:
  name: API token
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/api/settings/api-token"
  auth: inherit
settings:
  encodeUrl: true
docs: |
  The token masked to its last four characters (`last4`), and where it comes from:
  `env` (`AUDIBLE_SYNC_API_TOKEN`, changed there) or `stored` (generated once and kept
  encrypted in the database).
