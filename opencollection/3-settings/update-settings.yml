info:
  name: Update settings
  type: http
  seq: 2
http:
  method: PUT
  url: "{{baseUrl}}/api/settings"
  body:
    type: json
    data: |-
      {
        "sync_enabled": true,
        "sync_interval_minutes": 360,
        "max_download": 2
      }
  auth: inherit
settings:
  encodeUrl: true
docs: |
  A partial update: only the fields sent change, and `null` clears an optional one
  (`max_download`, `max_consecutive_failures`, `webhook_url`). Unknown fields are a 422,
  and so is a value the validators refuse (an interval under 5, a bitrate over 256).
  
  Fields: `debug`, `sync_enabled`, `sync_interval_minutes`, `max_download`, `max_attempts`,
  `max_consecutive_failures`, `auto_monitor_new`, `download_folder`, `audiobook_folder`,
  `folder_template`, `filename_template`, `encoding_format` (`m4b` or `oga`), `bitrate`,
  `webhook_url`.
