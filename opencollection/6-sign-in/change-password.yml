info:
  name: Change password
  type: http
  seq: 5
http:
  method: PUT
  url: "{{baseUrl}}/api/auth/password"
  body:
    type: json
    data: |-
      {
        "current_password": "the current password",
        "new_password": "at least twelve characters"
      }
  auth: inherit
settings:
  encodeUrl: true
docs: |
  403 when the current password is wrong, 422 for a new one under 12 characters.
  Every other session is signed out; the one making the change stays (with the bearer
  token there is none, so every session goes). Forgotten? On the server:
  `audible-sync reset-password`.
