info:
  name: List the wishlists
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/api/wishlist?sort=date_added&page=1&page_size=50"
  params:
    - name: sort
      value: "date_added"
      type: query
      description: date_added (newest first), title or release_date
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "50"
      type: query
      description: 1-200
    - name: order
      value: "asc"
      type: query
      description: asc or desc, to turn the sort round
      disabled: true
    - name: account_id
      value: "1"
      type: query
      disabled: true
  auth: inherit
settings:
  encodeUrl: true
docs: |
  Every account's wishlist in one list, and when each was last read.
