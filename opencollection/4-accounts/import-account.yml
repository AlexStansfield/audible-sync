info:
  name: Import an auth file
  type: http
  seq: 10
http:
  method: POST
  url: "{{baseUrl}}/api/accounts/import"
  body:
    type: json
    data: |-
      {
        "path": "/root/.audible/audible.json",
        "name": null,
        "monitor_existing": true
      }
  auth: inherit
settings:
  encodeUrl: true
docs: |
  An `audible-cli` auth file at a path the *service* can read (inside the container). 201 with the account; 400 when the file is missing or the `audible` library rejects it.
