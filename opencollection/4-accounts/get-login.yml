info:
  name: Get a login
  type: http
  seq: 8
http:
  method: GET
  url: "{{baseUrl}}/api/accounts/login/:login_id"
  params:
    - name: login_id
      value: ""
      type: path
      description: the login_id a start returned
  auth: inherit
settings:
  encodeUrl: true
docs: |
  `pending`, `confirmed` with the `account` (`replaced` when it already existed and only got new credentials), `expired`, `failed` with the `error`, or `cancelled`. 404 once the login has been forgotten (15 minutes after it ended); start again.
