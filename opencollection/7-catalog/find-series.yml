info:
  name: Find a series by name
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/api/catalog/series?name=Old Man's War"
  params:
    - name: name
      value: "Old Man's War"
      type: query
    - name: author
      value: "John Scalzi"
      type: query
      disabled: true
    - name: account_id
      value: "1"
      type: query
      description: the account to ask through; the oldest signed in by default
      disabled: true
  auth: inherit
settings:
  encodeUrl: true
docs: |
  The series called `name`, or containing it, best first. Read one with Get a series.
