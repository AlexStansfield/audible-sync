<script type="text/x-dc" data-dc-script data-props='{"mobileMenu":{"editor":"boolean","default":false},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"kind":{"editor":"enum","options":["book","route"],"default":"book"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const book = (this.props.kind || 'book') === 'book';
    return {
      theme: this.props.theme ?? 'dark',
      navOpen: (this.state && this.state.navOpen != null) ? this.state.navOpen : (this.props.mobileMenu ?? false),
      openNav: () => this.setState({ navOpen: true }),
      closeNav: () => this.setState({ navOpen: false }),
      title: book ? 'This book is not in your library' : 'Page not found',
      text: book ? 'It may belong to an account that was removed, or the link is out of date.' : 'There is nothing at this address. Check the link, or start again from the dashboard.',
      path: book ? '/library/9142' : '/libary',
      primary: book ? 'Back to the library' : 'Open the library',
      primaryHref: 'Library.dc.html',
    };
  }
}
</script>
