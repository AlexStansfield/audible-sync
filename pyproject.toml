[project]
name = "audible-sync"
version = "0.1.0"
description = "Sync your Audible library and decrypt your audiobooks to DRM-free M4B files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audible==0.10.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "mutagen>=1.48.1",
    "tqdm==4.67.1",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
# src/audible.py shadows the third-party `audible` dependency, so isort would treat
# every `import audible` as first-party and silently accept a merged import block.
known-third-party = ["audible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
