[project]
name = "audible-sync"
version = "3.0.2"
description = "Sync your Audible library and decrypt your audiobooks to DRM-free M4B files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audible==0.13.1",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "httpx==0.28.1",
    "mutagen>=1.48.1",
    "tqdm==4.67.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
audible-sync = "audible_sync.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["audible_sync", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# For `from tests.conftest import ...`; the package itself is imported from the install
pythonpath = ["."]
